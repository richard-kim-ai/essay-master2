<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Essay Master 현재 작업 마인드맵</title>
  <desc id="desc">Essay Master 프로젝트의 사용자 역할, 프론트엔드, 백엔드, 데이터 모델, AI 기능, 최근 작업, 검증과 운영 구조를 요약한 마인드맵</desc>
  <defs>
